<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0d2c4d"/>
      <stop offset="1" stop-color="#030912"/>
    </radialGradient>
    <radialGradient id="sea" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#1679b8"/>
      <stop offset="0.55" stop-color="#0b4470"/>
      <stop offset="1" stop-color="#061f38"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="globe"><circle cx="256" cy="268" r="168"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- atmosphere halo -->
  <circle cx="256" cy="268" r="180" fill="#0ea5e9" opacity="0.28" filter="url(#soft)"/>

  <!-- globe -->
  <circle cx="256" cy="268" r="168" fill="url(#sea)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#7dd3fc" stroke-opacity="0.32" stroke-width="4">
    <ellipse cx="256" cy="268" rx="62" ry="168"/>
    <ellipse cx="256" cy="268" rx="122" ry="168"/>
    <line x1="256" y1="90" x2="256" y2="446"/>
    <line x1="80" y1="268" x2="432" y2="268"/>
    <path d="M96 196 Q256 228 416 196"/>
    <path d="M96 340 Q256 308 416 340"/>
    <!-- simplified landmass silhouettes -->
    <path d="M138 170 q36 -26 74 -10 q14 26 -10 44 q-30 8 -38 34 q-28 6 -34 -22 q-10 -26 8 -46z" fill="#22c55e" fill-opacity="0.22" stroke="none"/>
    <path d="M300 320 q40 -10 64 14 q6 34 -26 50 q-34 4 -46 -22 q-6 -26 8 -42z" fill="#22c55e" fill-opacity="0.22" stroke="none"/>
  </g>
  <circle cx="256" cy="268" r="168" fill="none" stroke="#38bdf8" stroke-width="6"/>

  <!-- other vessels -->
  <g>
    <circle cx="176" cy="300" r="9" fill="#10b981"/>
    <circle cx="214" cy="372" r="8" fill="#f59e0b"/>
    <circle cx="338" cy="210" r="8" fill="#ef4444"/>
    <circle cx="150" cy="232" r="7" fill="#e2e8f0" opacity="0.85"/>
  </g>

  <!-- track -->
  <path d="M120 392 C190 380 210 320 250 300 S310 262 322 236" fill="none" stroke="url(#track)" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 16"/>
  <path d="M206 336 C232 312 284 288 322 236" fill="none" stroke="url(#track)" stroke-width="8" stroke-linecap="round"/>

  <!-- AIS signal arcs -->
  <g fill="none" stroke="#7dd3fc" stroke-linecap="round" stroke-width="10">
    <path d="M370 150 a52 52 0 0 1 30 46" opacity="0.95"/>
    <path d="M378 104 a98 98 0 0 1 66 88" opacity="0.6"/>
  </g>

  <!-- hero ship: AIS chevron heading NE -->
  <g transform="translate(330 222) rotate(42)" filter="url(#glow)">
    <path d="M0 -58 L34 40 L0 22 L-34 40 Z" fill="#ffffff" stroke="#0ea5e9" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
